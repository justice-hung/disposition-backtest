# 處置股回測：每個交易日盤後自動抓證交所／櫃買處置公告、注意股、日 K、法人、融券資料，重算回測，
# 把結果推回 repo，GitHub Pages 自動重新發佈網頁；有設定 LINE 金鑰就推播作戰清單。
name: 處置股回測每日更新

on:
  schedule:
    - cron: "40 11 * * 1-5"   # 台灣時間週一到週五 19:40（排程可能延遲 10~30 分鐘）
    - cron: "17 14 * * 1-5"   # 22:17 備援：GitHub 偶爾會漏跑排程；同一天不會重複通知
  workflow_dispatch:           # 可在 Actions 頁手動執行

permissions:
  contents: write

concurrency:
  group: disposition-backtest
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 回測
        run: node backtest.mjs
      - name: 推回 repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data.js cache history.json k
          if git diff --cached --quiet; then echo "沒有變更"; exit 0; fi
          git commit -m "回測更新 $(TZ=Asia/Taipei date +%F' '%H:%M)"
          for i in 1 2 3; do git pull --rebase --autostash && git push && break; sleep 10; done
      - name: LINE 通知
        if: always()
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_TO: ${{ secrets.LINE_TO }}
        run: node notify.mjs
