name: 處置股回測每日更新

on:
  schedule:
    - cron: "40 10 * * 1-5"   # 台北時間週一到週五 18:40（處置公告與日 K 都已出來）
  workflow_dispatch:           # 可在 Actions 頁手動執行

permissions:
  contents: write

concurrency:
  group: disposition-backtest
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-disposition.txt
      - name: 回測
        run: python scripts/disposition_backtest.py
      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs/disposition/data.json data/disposition/cache
          if git diff --cached --quiet; then echo "沒有變更"; exit 0; fi
          git commit -m "處置股回測更新 $(TZ=Asia/Taipei date +%F)"
          git push
